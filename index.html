<!--
README
- A frontend-only passcode only keeps out casual visitors. The hashes live in this page and in the browser, so a determined person can bypass them. For real privacy you need a backend (Firebase, Supabase...).
- Defaults: viewer 1234, creator 0000. Open this page with #reset on the end of the URL to restore them (your content is kept).
- Edits are saved in the browser of the device you edit on. Use Export / Import to move them to another device.
- Set SHARE_URL in the script to your hosted address.
-->

<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
:root{--bg:#fff7f3;--card:#fff;--ink:#4a2c35;--rose:#c2185b;--blush:#f8d7de;--gold:#b8893b}
.dark{--bg:#1f1218;--card:#2e1b26;--ink:#f7e1e8;--rose:#ff8fb3;--blush:#4d2c3b;--gold:#e0b564}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 Nunito,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.script{font-family:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;font-weight:400;color:var(--rose);text-align:center;font-size:2.6rem;line-height:1.2;margin:.3rem 0}
#lock{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;background:radial-gradient(circle at 50% 30%,#fbd3de,#e8849f);color:#4a2c35;text-align:center;padding:env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);overflow:auto;transition:opacity .5s}
#lock.out{opacity:0;pointer-events:none}
.lk{margin:auto;width:100%;max-width:320px;padding:1rem 0}
#lock .script{color:#c2185b;font-size:3rem}
.env{font-size:3rem}
.dots{height:2rem;font-size:1.3rem;line-height:2rem;color:#c2185b;margin:.4rem 0}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-auto-rows:72px;justify-content:center;align-items:center;justify-items:center}
.pad button{width:64px;height:64px;min-height:0;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#4a2c35;font-size:1.5rem;font-weight:700;box-shadow:0 2px 6px rgba(120,20,60,.2)}
.pad button:active{background:#fff;transform:scale(.94)}
#lock label{display:inline-flex;align-items:center;gap:.5rem;min-height:44px}
#lock input{width:20px;height:20px}
#lerr,.er{min-height:1.4em;color:#9b1239;font-weight:700;font-size:.95rem}
#lerr.ok{color:#14673a}
#hint{font-size:.9rem}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:sh .45s}
#bar{position:fixed;top:0;left:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 96px);padding:calc(6px + env(safe-area-inset-top)) 6px 6px calc(6px + env(safe-area-inset-left))}
#bar button{min-width:44px;border:1px solid var(--blush);background:var(--card);border-radius:22px;padding:0 10px;box-shadow:0 2px 8px rgba(194,24,91,.15)}
.eo{display:none}.ed .eo{display:inline-block}
.t{display:none}@media(min-width:520px){.t{display:inline}}
#saved{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:21;background:var(--gold);color:#2a1a06;font-weight:700;font-size:.85rem;border-radius:20px;padding:6px 12px;opacity:0;transition:opacity .25s;pointer-events:none}
#saved.on{opacity:1}
main{max-width:640px;margin:0 auto;padding:calc(3.6rem + env(safe-area-inset-top)) 1rem calc(6rem + env(safe-area-inset-bottom))}
.ed main{padding-top:calc(7.4rem + env(safe-area-inset-top))}
.card,.blk{background:var(--card);border-radius:20px;box-shadow:0 4px 18px rgba(194,24,91,.12)}
.letter{margin:1rem 0;padding:1.4rem 1.2rem;font:1.1rem/1.9 Georgia,'Times New Roman',serif;white-space:pre-wrap;overflow-wrap:break-word}
.ed [contenteditable]{outline:2px dashed var(--gold);outline-offset:3px;border-radius:8px}
[contenteditable]{min-height:1.5em}
.s2{text-align:center;margin-top:2.2rem}
.pill{display:inline-block;background:#c2185b;color:#fff;border:0;border-radius:999px;padding:.9rem 1.8rem;font-size:1.2rem;font-weight:700;min-height:44px;box-shadow:0 6px 18px rgba(194,24,91,.35)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:1.2rem 0}
.tools button,.ctl button{border:1px dashed var(--gold);background:var(--card);border-radius:22px;padding:0 14px}
.blk{margin:1rem 0;padding:1rem;text-align:center}
.bt{font-size:1.25rem;white-space:pre-wrap;overflow-wrap:break-word;padding:.4rem}
.blk img,.blk video{max-width:100%;border-radius:12px}
.vid{position:relative;padding-top:56.25%}
.vid iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:12px}
.qrbox{display:inline-block;background:#fff;color:#4a2c35;padding:8px;border-radius:8px;line-height:0;font-size:.9rem;max-width:100%}
.qrbox img,.qrbox canvas{display:block;max-width:100%}
.ctl{display:flex;justify-content:center;gap:8px;margin-top:.6rem}
.empty{text-align:center;opacity:.8}
.fl{position:fixed;bottom:-40px;z-index:40;pointer-events:none;color:#e8497f;animation:rise 3s ease-in forwards}
@keyframes rise{to{transform:translate(var(--dx),-115vh) rotate(var(--r));opacity:0}}
#mod{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(40,10,25,.55);padding:1rem;overflow:auto}
.mbox{margin:auto;width:380px;max-width:92vw;background:var(--card);color:var(--ink);border-radius:20px;padding:1.2rem}
.mbox h3{font-size:2.2rem}
.mbox label{font-weight:700;font-size:.9rem}
.mbox input{display:block;width:100%;min-height:44px;margin:.3rem 0 .8rem;border:1px solid var(--blush);border-radius:12px;padding:.5rem .7rem;font:inherit;background:var(--bg);color:var(--ink)}
.mbox .dots{text-align:center}
.mbox .note{font-size:.85rem;opacity:.85}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:.6rem}
.btn{border:0;border-radius:22px;padding:0 1.1rem;background:var(--blush)}
.btn.p{background:#c2185b;color:#fff}
#mini{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:flex-end;background:var(--card);border-radius:16px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.28)}
#vw{width:96px;height:54px;border-radius:8px;overflow:hidden;background:#000}
#mini.big #vw{width:200px;height:113px}
#vw iframe{width:100%;height:100%;border:0}
.mrow{display:flex;align-items:center;gap:2px}
.mrow button{border:0;background:none;min-width:40px;font-size:1.1rem}
.mrow input{width:70px}
#err{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00020;color:#fff;padding:.6rem 1rem;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="lock"><div class="lk" id="lk">
<div class="env" aria-hidden="true">💌</div>

<script>
var $=function(i){return document.getElementById(i)};
function showErr(m){var b=$('err');b.textContent='⚠ '+m+' (tap to dismiss)';b.style.display='block'}
window.onerror=function(m,s,l){showErr(m+(l?' @'+l:''));return false};
window.addEventListener('unhandledrejection',function(e){var r=e.reason;showErr(r&&r.message?r.message:String(r))});

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function RM(){return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}

/* pure-JS SHA-256 (hex), used when crypto.subtle is missing */
function sha256(m){
 var K=[],H=[],p=2,n=0,i,j,fr=function(x){return((x-Math.floor(x))*4294967296)|0};
 for(;n<64;p++){for(j=2;j*j<=p&&p%j;j++);if(j*j>p){if(n<8)H[n]=fr(Math.pow(p,.5));K[n++]=fr(Math.pow(p,1/3))}}
 var s=unescape(encodeURIComponent(m)),l=s.length,N=(((l+8)>>6)+1)*16,w=[];
 for(i=0;i<N;i++)w[i]=0;
 for(i=0;i<l;i++)w[i>>2]|=s.charCodeAt(i)<<(24-8*(i&3));
 w[l>>2]|=128<<(24-8*(l&3));w[N-1]=l*8;
 var h=H.slice(),ro=function(x,k){return(x>>>k)|(x<<(32-k))},a,b,c,d,e,f,g,hh,t1,t2,W,s0,s1;
 for(i=0;i<N;i+=16){
  W=w.slice(i,i+16);
  for(j=16;j<64;j++){s0=ro(W[j-15],7)^ro(W[j-15],18)^(W[j-15]>>>3);s1=ro(W[j-2],17)^ro(W[j-2],19)^(W[j-2]>>>10);W[j]=(W[j-16]+s0+W[j-7]+s1)|0}
  a=h[0];b=h[1];c=h[2];d=h[3];e=h[4];f=h[5];g=h[6];hh=h[7];
  for(j=0;j<64;j++){
   t1=(hh+(ro(e,6)^ro(e,11)^ro(e,25))+((e&f)^(~e&g))+K[j]+W[j])|0;
   t2=((ro(a,2)^ro(a,13)^ro(a,22))+((a&b)^(a&c)^(b&c)))|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
 return h.map(function(x){return('0000000'+(x>>>0).toString(16)).slice(-8)}).join('')}
/*sha-end*/
function hash(s){
 try{if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){var a=new Uint8Array(b),h='';for(var i=0;i<a.length;i++)h+=('0'+a[i].toString(16)).slice(-2);return h},function(){return sha256(s)})}}catch(e){}
 return Promise.resolve(sha256(s))}

/* YouTube link parser: returns {v:videoId,l:listId} or null; IDs only contain [\w-] */
function yt(u){
 u=String(u||'').trim();
 if(!/^https?:\/\/(?:[\w-]+\.)*(?:youtube\.com|youtube-nocookie\.com|youtu\.be)\//i.test(u))return null;
 var l=u.match(/[?&]list=([\w-]{10,64})/),v=u.match(/(?:youtu\.be\/|[?&]v=|\/(?:shorts|embed|live|v)\/)([\w-]{11})(?![\w-])/);
 if(v&&v[1]==='videoseries')v=null;
 if(!l&&!v)return null;
 return{v:v?v[1]:'',l:l?l[1]:''}}
/*yt-end*/
var DIRECT=/^https?:\/\/[^\s"'<>]+\.(mp4|webm|mov)([?#][^\s"'<>]*)?$/i;

var K='ann2_data',SHARE_URL='',
DEF={head:'A Letter For You',
letter:'My love,\n\nEvery day with you is my favorite chapter. Thank you for your patience, your laughter, and the way you make ordinary days feel special.\n\nI promise to keep choosing you, today and always.\n\nHappy Anniversary.\n\nForever yours 💗',
btn:'Tap for a surprise 💝',blocks:[{t:'text',v:'Happy Anniversary 💗'}],
vh:'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',
ch:'9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0',hint:'Our special day',music:''},
D,edit=false,rev=false,pad=null,warned=false,saveT,flashT,typ,qrT,
mus={f:null,key:'',on:true,mu:false};

/* storage (every access is guarded) */
function sg(s,k){try{return window[s].getItem(k)}catch(e){return null}}
function ss(s,k,v){try{window[s].setItem(k,v);return true}catch(e){return false}}
function sd(s,k){try{window[s].removeItem(k)}catch(e){}}

function merge(o){
 var d=JSON.parse(JSON.stringify(DEF));
 if(!o||typeof o!=='object')return d;
 ['head','letter','btn','hint','music'].forEach(function(k){if(typeof o[k]==='string')d[k]=o[k]});
 ['vh','ch'].forEach(function(k){if(typeof o[k]==='string'&&/^[0-9a-f]{64}$/.test(o[k]))d[k]=o[k]});
 if(Array.isArray(o.blocks))d.blocks=o.blocks.filter(function(b){return b&&typeof b.v==='string'&&/^(text|image|video|qr)$/.test(b.t)}).map(function(b){return{t:b.t,v:b.v}});
 return d}
try{D=merge(JSON.parse(sg('localStorage',K)))}catch(e){D=merge(null)}

function flash(){var s=$('saved');s.classList.add('on');clearTimeout(flashT);flashT=setTimeout(function(){s.classList.remove('on')},1200)}
function save(){
 if(ss('localStorage',K,JSON.stringify(D)))flash();
 else if(!warned){warned=true;alert('This device would not save your changes. Everything still works for now, but use ⬇ Export to keep a copy.')}}
function later(){clearTimeout(saveT);saveT=setTimeout(save,350)}

/* night mode */
function night(on){document.documentElement.classList.toggle('dark',on)}
var nm=sg('localStorage','ann2_night');
night(nm===null?!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches):nm==='1');
$('bN').onclick=function(){var on=!document.documentElement.classList.contains('dark');night(on);ss('localStorage','ann2_night',on?'1':'0')};

/* on-screen keypad */
function keypad(box,dots,done){
 var v='';
 function paint(){var s='';for(var i=0;i<v.length;i++)s+='● ';dots.textContent=s||'\u00a0'}
 var o={press:function(k){
   if(k==='✓'){if(v)done(v,o)}
   else{if(k==='⌫')v=v.slice(0,-1);else if(v.length<12)v+=k;paint()}},
  reset:function(){v='';paint()}};
 box.innerHTML='';
 '123456789⌫0✓'.split('').forEach(function(k){
  var b=document.createElement('button');b.type='button';b.textContent=k;
  b.setAttribute('aria-label',k==='⌫'?'Delete':k==='✓'?'Enter':k);
  b.onclick=function(){o.press(k)};box.appendChild(b)});
 paint();return o}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&!$('mod').hidden){closeDlg();return}
 if(!pad)return;
 var k=e.key;
 if(/^\d$/.test(k))pad.press(k);else if(k==='Backspace')pad.press('⌫');else if(k==='Enter')pad.press('✓');else return;
 e.preventDefault()});

/* lock screen */
$('hint').textContent=D.hint?'Hint: '+D.hint:'';
pad=keypad($('pad'),$('dots'),function(v,o){
 // sync hash on purpose: keeps the tap's user-gesture alive so the music may start
 var h=sha256(v),c=h===D.ch;
 if(c||h===D.vh){
  var r=$('rem').checked;
  ss(r?'localStorage':'sessionStorage','ann2_ok','1');sd(r?'sessionStorage':'localStorage','ann2_ok');
  unlock(c)}
 else{
  $('lerr').className='';$('lerr').textContent='Not quite, my love. Try again 💗';
  var l=$('lk');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');o.reset()}});
function unlock(c,quick){
 startMusic();pad=null;
 $('app').hidden=false;setEd(c);
 var l=$('lock');
 if(quick){l.parentNode.removeChild(l);return}
 l.classList.add('out');
 setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l)},520)}
$('bL').onclick=function(){sd('localStorage','ann2_ok');sd('sessionStorage','ann2_ok');location.reload()};
function chkReset(){
 if(location.hash!=='#reset')return false;
 D.vh=DEF.vh;D.ch=DEF.ch;ss('localStorage',K,JSON.stringify(D));
 var e=$('lerr');e.className='ok';e.textContent='Codes reset ✓ Viewer 1234 · Creator 0000';
 try{history.replaceState(null,'',location.pathname+location.search)}catch(x){try{location.hash=''}catch(y){}}
 return true}
window.addEventListener('hashchange',function(){if(chkReset()&&!$('lock'))alert('Codes reset ✓ Viewer 1234 · Creator 0000')});

/* dialogs */
function dlg(title,html){
 var m=$('mod');
 m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h3 class="script">'+esc(title)+'</h3>'+html+'</div>';
 m.hidden=false;m.onclick=function(e){if(e.target===m)closeDlg()};
 var i=m.querySelector('input,textarea');if(i)try{i.focus()}catch(e){}
 return m.firstChild}
function closeDlg(){var m=$('mod');m.hidden=true;m.innerHTML='';pad=null}
function er(t){$('e').textContent=t}
var FOOT='<div class="er" id="e" role="alert"></div><div class="row"><button class="btn" id="x">Cancel</button><button class="btn p" id="ok">Add</button></div>';
function pinDlg(){
 dlg('Creator PIN','<div class="dots" id="d2"></div><div class="pad" id="p2"></div><div class="er" id="e" role="alert"></div><div class="row"><button class="btn" id="x">Cancel</button></div>');
 $('x').onclick=closeDlg;
 pad=keypad($('p2'),$('d2'),function(v,o){
  if(sha256(v)===D.ch){closeDlg();setEd(true)}else{er('Wrong PIN. Try again.');o.reset()}})}
function vidDlg(){
 dlg('Add a video','<label for="u">YouTube link or direct .mp4 / .webm / .mov link</label><input id="u" type="url" inputmode="url" autocomplete="off">'+FOOT);
 $('x').onclick=closeDlg;
 $('ok').onclick=function(){
  var u=$('u').value.trim();
  if(!yt(u)&&!DIRECT.test(u))return er('Use a YouTube link or a direct .mp4, .webm or .mov link.');
  D.blocks.push({t:'video',v:u});closeDlg();blocks();save()}}
function qrDlg(){
 dlg('Add a QR code','<label for="u">Text or link for the QR code</label><input id="u" autocomplete="off">'+FOOT);
 $('x').onclick=closeDlg;
 $('ok').onclick=function(){
  var u=$('u').value.trim();if(!u)return er('Type some text or a link first.');
  D.blocks.push({t:'qr',v:u});closeDlg();blocks();save()}}
function setDlg(){
 dlg('Settings','<label for="sv">New viewer passcode (blank = keep)</label><input id="sv" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">'
 +'<label for="sc">New creator PIN (blank = keep)</label><input id="sc" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">'
 +'<label for="sh">Hint on the lock screen</label><input id="sh" maxlength="80" value="'+esc(D.hint)+'">'
 +'<label for="sm">Background music (YouTube link)</label><input id="sm" type="url" value="'+esc(D.music)+'">'
 +FOOT.replace('>Add<','>Save<'));
 $('x').onclick=closeDlg;
 $('ok').onclick=function(){
  var v=$('sv').value.trim(),c=$('sc').value.trim(),m=$('sm').value.trim(),re=/^\d{3,12}$/;
  if((v&&!re.test(v))||(c&&!re.test(c)))return er('Codes must be 3 to 12 digits, numbers only.');
  if(m&&!yt(m))return er('That does not look like a YouTube link.');
  Promise.all([v?hash(v):D.vh,c?hash(c):D.ch]).then(function(h){
   if(h[0]===h[1])return er('Viewer and creator codes must be different.');
   D.vh=h[0];D.ch=h[1];D.hint=$('sh').value.trim();D.music=m;save();closeDlg();startMusic()})}}
function copyTxt(t,btn){
 var ok=function(){btn.textContent='Copied ✓';setTimeout(function(){btn.textContent='Copy link'},1500)},
 fb=function(){var i=$('su');i.select();try{i.setSelectionRange(0,9999)}catch(e){}try{document.execCommand('copy')?ok():alert('Select the link and copy it.')}catch(e){alert('Select the link and copy it.')}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
function shareDlg(){
 dlg('Share','<label for="su">Link to share</label><input id="su" type="url" value="'+esc(SHARE_URL||location.href.split('#')[0])+'">'
 +'<div style="text-align:center"><div class="qrbox" id="sq"></div></div>'
 +'<div class="row" style="justify-content:center"><button class="btn" id="sc2">Copy link</button><button class="btn p" id="ss">Share…</button></div>'
 +'<p class="note">Your edits live on the device you edit with. Send the ⬇ Export backup too, and import it on the other device.</p>'
 +'<div class="row"><button class="btn" id="x">Close</button></div>');
 var u=$('su');mkQR($('sq'),u.value);
 u.oninput=function(){clearTimeout(qrT);qrT=setTimeout(function(){mkQR($('sq'),u.value)},300)};
 $('x').onclick=closeDlg;
 $('sc2').onclick=function(){copyTxt(u.value,this)};
 $('ss').onclick=function(){if(navigator.share)navigator.share({title:'For you 💗',url:u.value}).catch(function(){});else copyTxt(u.value,$('sc2'))}}

/* QR */
function mkQR(el,t){
 el.innerHTML='';
 if(!window.QRCode){el.textContent='QR codes need an internet connection.';return}
 try{new QRCode(el,{text:t||' ',width:200,height:200,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
 catch(e){el.textContent='That text is too long for a QR code.'}}
function drawQR(){
 var n=document.querySelectorAll('.qrbox[data-q]');
 for(var i=0;i<n.length;i++){var b=D.blocks[+n[i].getAttribute('data-q')];if(b)mkQR(n[i],b.v)}}

/* page rendering */
function setEd(on){edit=on;document.body.classList.toggle('ed',on);$('bE').textContent=on?'✏️ Done':'✏️ Edit';render()}
function render(){
 var ce=edit?' contenteditable="true"':'';
 $('main').innerHTML='<h2 class="script" id="hd" data-f="head"'+ce+'>'+esc(D.head)+'</h2>'
 +'<div class="card letter" id="lt" data-f="letter"'+ce+' aria-label="Love letter">'+(edit?esc(D.letter):'<span id="ta"></span><span id="tb"></span>')+'</div>'
 +'<section class="s2">'
 +(edit?'<div class="pill" id="sbtn" data-f="btn"'+ce+'>'+esc(D.btn)+'</div>'
  +'<div class="tools"><button data-add="text">+ Text</button><button data-add="img">+ Photo / QR image</button><button data-add="vid">+ Video link</button><button data-add="qr">+ QR code</button></div>'
  :(rev?'':'<button class="pill" id="sbtn">'+esc(D.btn)+'</button>'))
 +'<div id="sb"'+(edit||rev?'':' hidden')+'></div></section>';
 blocks();if(!edit)typeIt()}
function typeIt(){
 clearInterval(typ);
 var T=D.letter,a=$('ta'),b=$('tb');a.textContent='';b.textContent=T;
 function all(){clearInterval(typ);a.textContent=T;b.textContent=''}
 $('lt').onclick=all;
 if(!('IntersectionObserver' in window)||RM()){all();return}
 var n=0,st=Math.max(1,Math.ceil(T.length/325)),
 io=new IntersectionObserver(function(es){
  if(!es[0].isIntersecting)return;io.disconnect();
  typ=setInterval(function(){
   n+=st;if(/[\ud800-\udbff]/.test(T.charAt(n-1)))n++;
   if(n>=T.length)return all();
   a.textContent=T.slice(0,n);b.textContent=T.slice(n)},40)},{threshold:.3});
 io.observe($('lt'))}
function blockHtml(b,i){
 var e=edit;
 if(b.t==='text')return'<div class="bt" data-b="'+i+'"'+(e?' contenteditable="true"':'')+'>'+esc(b.v)+'</div>';
 if(b.t==='image')return/^(data:image\/|https:\/\/)/i.test(b.v)?'<img src="'+esc(b.v)+'" alt="A photo from my heart">':'';
 if(b.t==='qr')return'<div class="qrbox" data-q="'+i+'" role="img" aria-label="QR code"></div>';
 var p=yt(b.v);
 if(p)return'<div class="vid"><iframe src="https://www.youtube.com/embed/'+(p.v||'videoseries')+'?rel=0'+(p.l?'&list='+p.l:'')+'" title="Video" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';
 if(DIRECT.test(b.v))return'<video controls playsinline preload="metadata" src="'+esc(b.v)+'"></video>';
 return''}
function blocks(){
 var h='';
 D.blocks.forEach(function(b,i){
  h+='<div class="blk">'+blockHtml(b,i)+(edit?'<div class="ctl"><button data-m="up" data-i="'+i+'" aria-label="Move up">↑</button><button data-m="down" data-i="'+i+'" aria-label="Move down">↓</button><button data-m="del" data-i="'+i+'">Delete</button></div>':'')+'</div>'});
 $('sb').innerHTML=h||(edit?'<p class="empty">No surprises yet. Add one above.</p>':'');
 drawQR()}
function reveal(){
 rev=true;$('sbtn').hidden=true;$('sb').hidden=false;burst();
 setTimeout(function(){$('sb').scrollIntoView({behavior:RM()?'auto':'smooth',block:'center'})},60)}
function burst(){
 if(RM())return;
 var c=['♥','💗','🌸'];
 for(var i=0;i<26;i++){
  var s=document.createElement('span');s.className='fl';s.textContent=c[i%3];
  s.style.cssText='left:'+(Math.random()*92+2)+'%;font-size:'+(18+Math.random()*22)+'px;animation-delay:'+(Math.random()*.9)+'s;animation-duration:'+(2.4+Math.random()*1.6)+'s;--dx:'+(Math.random()*80-40)+'px;--r:'+(Math.random()*80-40)+'deg';
  document.body.appendChild(s);
  (function(n){setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n)},4800)})(s)}}

/* page events */
var main=$('main');
main.addEventListener('input',function(e){
 var t=e.target,f=t.getAttribute&&t.getAttribute('data-f'),b=t.getAttribute&&t.getAttribute('data-b');
 if(!t.isContentEditable)return;
 var x=t.innerText.replace(/\u00a0/g,' ');
 if(f&&f!=='letter')x=x.replace(/\n/g,' ');
 if(f)D[f]=x;else if(b!==null&&D.blocks[+b])D.blocks[+b].v=x;
 later()});
main.addEventListener('keydown',function(e){var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(e.key==='Enter'&&(f==='head'||f==='btn'))e.preventDefault()});
main.addEventListener('paste',function(e){
 if(!e.target.isContentEditable)return;
 e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'))});
main.addEventListener('click',function(e){
 var t=e.target.closest?e.target.closest('[data-m],[data-add],#sbtn'):null;
 if(!t)return;
 if(t.id==='sbtn'){if(!edit)reveal();return}
 var a=t.getAttribute('data-add'),m=t.getAttribute('data-m');
 if(a==='text'){
  D.blocks.push({t:'text',v:'Write something sweet 💗'});blocks();save();
  var n=document.querySelectorAll('.bt');if(n.length)n[n.length-1].focus()}
 else if(a==='img')$('fimg').click();
 else if(a==='vid')vidDlg();
 else if(a==='qr')qrDlg();
 else if(m){
  var i=+t.getAttribute('data-i');
  if(m==='del'){if(!confirm('Delete this block?'))return;D.blocks.splice(i,1)}
  else{var j=m==='up'?i-1:i+1;if(j<0||j>=D.blocks.length)return;var x=D.blocks[i];D.blocks[i]=D.blocks[j];D.blocks[j]=x}
  blocks();save()}});

/* photo upload: resize to max 900px, JPEG 0.75 */
$('fimg').onchange=function(){
 var f=this.files&&this.files[0];this.value='';if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var im=new Image();
  im.onload=function(){
   var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
   var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
   D.blocks.push({t:'image',v:c.toDataURL('image/jpeg',.75)});blocks();save()};
  im.onerror=function(){alert('That file could not be read as an image.')};
  im.src=r.result};
 r.readAsDataURL(f)};

/* top bar */
$('bE').onclick=function(){if(edit)setEd(false);else pinDlg()};
$('bS').onclick=setDlg;
$('bH').onclick=shareDlg;
$('bX').onclick=function(){
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='anniversary-backup.json';
 document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a)},1500)};
$('bI').onclick=function(){$('fimp').click()};
$('fimp').onchange=function(){
 var f=this.files&&this.files[0];this.value='';if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var o;
  try{o=JSON.parse(r.result);if(!o||typeof o!=='object'||(typeof o.letter!=='string'&&!Array.isArray(o.blocks)))throw 0}
  catch(e){alert('That file is not a valid backup.');return}
  D=merge(o);save();render();startMusic();alert('Backup restored ✓')};
 r.readAsText(f)};

/* background music: plain YouTube iframe + postMessage, no API script */
function cmd(fn,args){try{if(mus.f)mus.f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:args||[]}),'*')}catch(e){}}
function stopMusic(){if(mus.f&&mus.f.parentNode)mus.f.parentNode.removeChild(mus.f);mus.f=null;mus.key='';$('mini').hidden=true}
function startMusic(){
 var p=yt(D.music),m=$('mini');
 if(!p){stopMusic();return}
 var key=p.v+'|'+p.l;
 if(mus.f&&mus.key===key){m.hidden=false;return}
 stopMusic();
 var f=document.createElement('iframe');
 f.src='https://www.youtube.com/embed/'+(p.v||'videoseries')+'?autoplay=1&loop=1&playsinline=1&controls=0&enablejsapi=1&'+(p.l?'list='+p.l:'playlist='+p.v);
 f.title='Background music';f.allow='autoplay; encrypted-media';f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
 f.onload=function(){var vol=+$('mv').value;cmd('setVolume',[vol]);setTimeout(function(){cmd('setVolume',[vol])},1500)};
 mus.f=f;mus.key=key;mus.on=true;mus.mu=false;
 $('mp').textContent='⏸';$('mm').textContent='🔊';
 $('vw').appendChild(f);m.hidden=false}
$('mp').onclick=function(){mus.on=!mus.on;cmd(mus.on?'playVideo':'pauseVideo');this.textContent=mus.on?'⏸':'▶'};
$('mm').onclick=function(){mus.mu=!mus.mu;cmd(mus.mu?'mute':'unMute');this.textContent=mus.mu?'🔇':'🔊'};
$('mv').oninput=function(){cmd('setVolume',[+this.value]);if(mus.mu){mus.mu=false;cmd('unMute');$('mm').textContent='🔊'}};
$('mb').onclick=function(){$('mini').classList.toggle('big')};

/* auto-open if this device is remembered (kept at the very end on purpose) */
var didReset=chkReset();
if(!didReset&&(sg('localStorage','ann2_ok')==='1'||sg('sessionStorage','ann2_ok')==='1'))unlock(false,true);
</script>
